name: Migration Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  migration-immutability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Kept at 20 to match local dev and the deployment server.
          # Bumped to 24 LTS as one coordinated change — see story 7-10.
          node-version: 20

      - name: Check migration immutability
        run: npm run check:migrations
        working-directory: travelplan
