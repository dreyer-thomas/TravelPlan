name: Security Audit

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travelplan/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: travelplan

      - name: Audit production dependencies
        run: npm run audit:check
        working-directory: travelplan
