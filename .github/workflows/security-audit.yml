name: Security Audit

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Kept at 20 to match local dev and the deployment server.
          # Bumped to 24 LTS as one coordinated change — see story 7-10.
          node-version: 20
          cache: npm
          cache-dependency-path: travelplan/package-lock.json

      - name: Install dependencies
        # --ignore-scripts: the audit only needs the resolved dependency tree,
        # not a generated Prisma client. It also keeps the postinstall hook
        # (prisma generate, which requires DATABASE_URL) out of CI.
        run: npm ci --ignore-scripts
        working-directory: travelplan

      - name: Audit production dependencies
        run: npm run audit:check
        working-directory: travelplan
