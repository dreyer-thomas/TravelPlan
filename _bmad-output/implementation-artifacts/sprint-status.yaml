for Tommy: the 8.3 blocker, contributor writes (documents mirror the galleries' owner-only gate, which sits oddly beside 5.4 and is pre-existing), DW-45 now at a FOURTH distinct stated size limit, and whether +N opens a Menu or a DialogShell list.)
# prior_note: 2026-08-05 (9-2-documents-in-print-and-an-offline-packet CONTEXTED via bmad-create-story; epic-9 moved backlog -> in-progress as the epic's first created story. STATUS IS ready-for-dev BUT THE STORY IS BLOCKED AND SAYS SO IN ITS FIRST SECTION: 9.2 depends on 9.1, which depends on 8.3, and both are still backlog with no story file - there is no document table, no upload route and no document on any entry, so there is nothing for this story to print or package. It was authored anyway, against the SPECIFIED shape of 9.1 in epics.md, with an instruction to re-read 9.1's story file and schema before starting because the field names, the accepted MIME list and the trips.documents.* namespace are 9.1's decisions. DO NOT DISPATCH A DEV AGENT AT 9-2 BEFORE 8-3 AND 9-1 ARE DONE. Five findings from the research pass that the epic does not name and that would each have shipped silently wrong: (1) pdf-lib CANNOT EMBED WEBP - embedJpg and embedPng are the entire API, while imageUploads.ts:13 accepts image/webp, so a WebP document is reachable and throws; (2) pdf-lib IGNORES EXIF ORIENTATION - a portrait phone photo commonly stores landscape pixels plus Orientation:6, which every browser applies and pdf-lib does not, so the packet prints the portrait ticket SIDEWAYS if the page is sized from image.width/height, and the two halves of this story therefore have genuinely different orientation behaviour (the HTML print half gets it free from image-orientation: from-image); (3) ENCRYPTED PDFs THROW on PDFDocument.load and airline/rail tickets are encrypted often enough to be a normal case, so a per-document catch is what keeps one bad ticket from costing the other nine - carried as its own AC; (4) drawText with StandardFonts is WINANSI-ONLY and throws at draw time, on label pages that carry USER-SUPPLIED FILE NAMES, so a Greek or CJK or typographic-dash file name takes the whole packet down; (5) the obvious empty-day code, not_found, is the WRONG one because TripTimeline.tsx:441 already maps it to trip-not-found. Also recorded: DAY_MENU_ITEM_SX is the byte-identical BROKEN version 5.11's browser pass found (DW-180) and is exactly what a new menu item would copy; the entry point goes in the day overflow menu and NOT the print page, because that page auto-fires window.print() so its buttons sit behind the print modal; the blob-download reasoning and helpers already exist in TripTimeline.tsx and want extracting rather than copying, as does toSafeSlug (DW-27); TripDayPrintDocument.tsx is 100% unlocalised English literals, so half-localising it is the trap and only the menu/error strings need both dictionaries; and DW-1, DW-2, DW-3 and DW-109 are live in the two files this story edits. pdf-lib checked against the registry rather than from memory: 1.17.1 is the latest, published October 2021, UNMAINTAINED, MIT, tree is @pdf-lib/standard-fonts + @pdf-lib/upng + pako@^1.0.11 + tslib@^1.11.1 with no advisories on Snyk for pdf-lib or pako, so audit:check should stay 0 - @cantoo/pdf-lib is the maintained fork named as the fallback if it does not, deliberately not the default.)
