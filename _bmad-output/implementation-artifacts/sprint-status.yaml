that route has no role-change operation at all, which AC5 needs. AC10 DECIDED: /users stays exactly as it is and the administration is a separate page, because the share dialog's link serves an OWNER's need this story does not remove, and because two payload shapes behind one role-branching endpoint makes the privacy floor a conditional one refactor from leaking; both reasons written into (routes)/users/page.tsx, and /users verified still 200 for an admin, a plain owner, and an account that just lost the role. AC8 IMPLEMENTED LITERALLY as 'at least one admin must remain', not 'not yourself' - an admin may hand the role on then drop their own, with a passing test - and the reachability of both guards is recorded honestly: on PATCH last_admin is reachable ONLY by self-demotion, and on DELETE the count guard is UNREACHABLE under the current rules (self-deletion is refused outright, so any admin deleted is not the caller), kept as a belt with tests asserting the INVARIANT rather than a status code. A lint rule improved the component: react-hooks/set-state-in-effect fires here where it does not on TripBucketListPanel (whose watch() makes the compiler skip it entirely), and rather than dodge it fetchList/requestCsrfToken now RETURN their results, which is what makes the mount effect's cancellation flag real instead of decorative. THE BROWSER PASS CANNOT BE DONE IN THIS ENVIRONMENT - no browser automation - so the manual check was driven over real HTTP against an isolated dev server: 54/54 assertions covering the middleware, the server-component gate, AppHeader's live read, every route, AC8c's admin:grant run for real in both its success and its loud-refusal paths, AC8b's positive path exercised in the ONLY place it ever can be, and Story 5.2's forced password change still firing for an admin-created account. NOT ONE RENDERED PIXEL IS VERIFIED: the page's layout, 390px/1400px behaviour and the opened menu are all unproven. Two of my first-pass assertions were written again