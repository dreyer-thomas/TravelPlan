d corrected before anything was concluded - a document-wide menuitem query that counted the header menu's mounted rows, two dismissal checks that could not dismiss (body behind the backdrop, synthetic keydown never reaching MUI's modal-root handler), and a 1200ms wait that read a row before its reload landed. 5.10's LAST OPEN ITEM closed in the same session, in BOTH directions on one build: as ADMIN the header menu shows 'Nutzerverwaltung' with href=/admin/users, as a non-admin the row is absent and the menu has three rows. That negative could not be inferred from server HTML, because MUI portals a closed Menu. npm run admin:grant exercised once more against the copy, exit 0. Final gates: 1389 tests across 119 files green, 0 src type errors, test type errors at their 143 baseline, lint at its exact 85-problem / 2-pre-existing-error baseline. Cleanup verified: server stopped, public/m511.js deleted, the operator's real prisma/dev.db bit-identical to its pre-session hash, nothing written to the real uploads tree. Deferred: DW-179 (the role select snaps back to the old role while the request is in flight - 5.10's re-read-after-mutate strategy, which 5.11 explicitly did not touch, and fixing it means optimistic state with its own rollback question), DW-180.)
# prior_note: 2026-08-04 (6-25-close-is-a-cross-keeping-is-named REVIEWED via bmad-code-review and DONE. Three parallel layers - Blind Hunter and Edge Case Hunter on a spec-free diff, Acceptance Auditor against the story - raised 34 findings, 24 after dedup: 4 decisions (Tommy), 16 patches (ALL APPLIED), 4 deferrals, 3 dismissed, 1 WITHDRAWN on verification. The chrome half of the story verified clean: common.cancel truly orphaned, closeLabel genuinely required, 11 DialogTitleWithClose call sites, both keep-confirmations correct, 1213/111 tests + lint 85/2 + 0 src type errors all reproduced EXACTLY as claimed. THE REVIEW'S WEIGHT FELL ENTIRELY ON AC7's DISCARD GUARD, where three findings said the same thing in three places: 'DISCARD' WAS NOT DISCARDING. (1) The day-image dialog kept the note it was told to throw away - handleCloseDayMeta only flipped dayMetaOpen while the re-seed effect keys on [day?.id, day?.note], and BOTH save paths post dayNoteDraft, so a later photo-only save would have written a DISCARDED NOTE TO THE SERVER. (2) The move picker kept the target day the user had just abandoned, pre-selected with confirm live - one click from moving the activity to the day it had been taken away from; the outer dialog's open effect resets it, but reopening the picker alone does not re-run that. (3) The accommodation dialog read raw isDirty under two on-open setValue(shouldDirty:true) effects, so a stay whose stored payment disagrees with its cost (a deposit; the import path restores these verbatim) interrogated a user who had touched nothing - SAME DEFECT CLASS as the heroImage FileList one the browser pass caught, and it survived because every fixture used the one shape (payments absent) where buildDefaultPayments makes the two sides equal BY CONSTRUCTION. All three fixed; all three pinned by a test VERIFIED TO FAIL WITHOUT ITS FIX. Also: useDiscardGuard gained a `busy` param because 'Aenderungen verwerfen' was a SILENT NO-OP whenever the closer early-returned on an in-flight write (question vanished, dialog stayed, explicit answer did nothing); TripShareDialog gained the guard outright on Tommy's call - AC7 says EVERY form dialog and its invite address, role and temporary password were thrown away wordlessly, it escaped the nine only because that list came from the common.cancel readers, which it never was; TripImportDialog stopped asking about a file the SERVER HAD REJECTED. THE STORY'S OWN RECORD WAS CORRECTED WHERE IT OVERSTATED: the four map-popup glyphs were claimed unit-covered and were NOT (dialogCloseAffordance.test.tsx does not import TripDayView or either map page - now asserted in both map suites); the 'each dialog's dirty signal in BOTH directions' claim covered FOUR of nine (bucket-list and import added); a closeLabel={undefined} case could not catch what its docstring claimed (renderShell spreads props AFTER the fixture); the noun-match assertion checked one language per pair BY ARRAY INDEX (now both pairs, both languages, by shared word); 'ten dialogs' in six docblocks is eleven; and dialogCloseAffordance.test.tsx carried a NEW tsc error (FullscreenPhoto fixture passing `url` for `imageUrl`, rendering a viewer with imageUrl undefined and passing anyway) - test type errors 144 -> 143. One finding WITHDRAWN rather than patched: the failed-hero-upload path reports the create form clean, which is CORRECT - the trip is already saved, so a discard question would name an outcome that is not on offer. Two exemptions ratified and moved OUT of the story into the components that hold them: TripImportDialog's post-import 'Fertig' (narrow, one state, not a dismissal offered instead of committing) and DiscardChangesDialog's absent X, which now explicitly SUPERSEDES 6.24's reading of AC3. Deferred, all pre-existing: DW-159 (Escape and the backdrop are NOT blocked during an in-flight write on the eleven raw <Dialog> sites while the X IS - the shell guards both, so 'identical by construction' holds for geometry, name, tooltip and focus ring but not for dismissal-during-write), DW-160 (those eleven set no aria-labelledby, so a screen reader announces an UNNAMED DIALOG - DialogTitleWithClose is now the one seam where that could be fixed once), DW-161 (the travel-segment open snapshot is derived from live props rather than captured at open - latent until the parent re-supplies segment mid-open), DW-162 (no destructive confirmation is drawn in the binding footer mockup). After the review: tests 1213 -> 1220 across 111 files all green, lint back at 85/2, 0 src type errors.)
# prior_note: 2026-08-04 (6-25-close-is-a-cross-keeping-is-named IMPLEMENTED via bmad-dev-story, awaiting review. Every dialog in the app is now dismissed by ONE icon-button.close at the top right of its title row: DialogShell's closeLabel became REQUIRED (both closeLabel? conditionals gone, so 6.24's heading-role shape is the only shape) and the glyph moved OUT into a shared src/components/ui/DialogCloseButton.tsx exporting DialogCloseButton + DialogTitleWithClose. FIFTEEN dialogs carry it - 4 via the shell, ELEVEN via DialogTitleWithClose - and the shell renders the same component, so 'whatever the shell does these must match it' is true by construction. That extraction is the one structural change and it is load-bearing three times over: the 44px geometry, the Tooltip-not-title choice AND THE FOCUS RING all travel with the glyph, where fifteen hand-copies would have drifted on the first edit (DW-154's app-wide gap on the other ~16 icon buttons is untouched). The heading fix travels too and had to: MUI's DialogTitle is an h2 with the glyph inside it, so nine dialogs would each have reintroduced 'Reise löschen · Schließen'. FOUR read-only map popups gained their FIRST visible dismissal - they had only backdrop and Escape, neither discoverable on touch. common.cancel is GONE from both dictionaries (eleven readers, all removed; i18nDictionaries.test.ts holds the line as it does for common.save). The two destructive confirmations keep BOTH buttons at unchanged weight and the safe one names what it preserves: trips.delete.keep 'Reise behalten'/'Keep trip' and trips.bucketList.deleteKeep 'Eintrag behalten'/'KEEP ITEM' - English deviates from the spec's parenthetical 'Keep entry' because its neighbour says 'Delete item' and two nouns for one object breaks the exact thing AC3 exists for; the noun match is now asserted. AC7: useDiscardGuard + DiscardChangesDialog own EXPERIENCE.md's dirty-form question once, 6.24's inline copy was folded into it, and its title/keep/discard keys promoted to common.discard.* (a common. name for a genuinely shared thing - the 6.17 trap is a shared-SOUNDING name with one reader, and these have ten). THE BROWSER PASS CAUGHT A DEFECT NO UNIT TEST COULD: an untouched 'Neue Reise' dialog asked 'Änderungen verwerfen?' on its own X, because heroImage is a registered file input whose empty FileList never deep-compares equal to the undefined in defaultValues, so react-hook-form's isDirty latched TRUE on the first render with dirtyFields EMPTY the whole time. Both heroImage forms had it. Fixed by reading dirtyFields plus an explicit selected-file flag; JSDOM DOES NOT REPRODUCE IT (its empty file input compares equal), so the untouched test passed before and after the fix and the new tests pin the file-chosen direction instead. Re-verified live over THREE open/close cycles - the third (untouched again after a discard) is what the flag's render-phase reset is for. Measured on screen at 390px and 1400px: insetRight 15.0px on every one of the thirteen dialogs reached, cancelButtons [] on all of them, 'Reise behalten' 139px beside 'Reise löschen' 137px so the pair reads as two outcomes, and the stay dialog scrolled 883px with glyphMovedPx 0 / headMovedPx 0 - the fixed-title-row assumption the whole pattern rests on, measured rather than assumed. THREE EXEMPTIONS WRITTEN DOWN rather than inferred, per DESIGN.md's 'every dialog has exactly one': the discard confirmation gets NO X because it is RAISED BY one and two clicks on the same corner would land the user back in the form they were leaving (this CONTRADICTS 6.24's reading of AC3, and is the opposite call from the two delete confirmations, which are raised by a delete action); TripShareDialog keeps its footer Schließen because moving it deletes a footer bar its own mockup draws and Task 6 scopes mockup work to forms-authoring.html (DW-157); FullscreenPhotoViewer has no title row at all. Both exemptions are PINNED BY TEST so neither drifts into a second control. TripImportDialog's post-import footer became 'Fertig' (new trips.import.done) because common.close beside the new X gave one dialog TWO controls named 'Schließen' - the suite caught it as an ambiguous query. Two lint regressions the pass surfaced were fixed not left: the travel-segment dialog's open snapshot became a useMemo (a ref read during render is react-hooks/refs AND a stale-baseline hazard) and TripEditDialog's flag reset moved from the open effect to a render-phase reset (react-hooks/set-state-in-effect, and it cleared one render late). Two suites needed a ThemeProvider they had never needed - the glyph reads theme.palette.tokens, absent under MUI's bare default theme - wrapped at each suite's own render helper rather than ~50 call sites. mockups/forms-authoring.html: two footers lost their cancel, both heads gained the X, a .dialog-close rule and an icon-button.close specimen added, btn-secondary specimen relabelled 'Reise behalten' because DESIGN.md now defines that variant by RANK and forbids that word on it; TWO GAPS RECORDED IN THE FILE rather than papered over - no destructive confirmation is mocked anywhere in it despite DESIGN.md naming it the binding footer reference, and Screen G still says 'Speichern' against 6.24's 'OK'. AC5 untouched: form confirmations still say OK. Tests 1181 -> 1213 across 111 files (test/dialogCloseAffordance.test.tsx is new, 28 cases asserting each dialog's dirty signal in BOTH directions, because a signal stuck false discards typing silently and one stuck true interrogates a form nobody touched). Lint back to its 85-problem / 2-pre-existing-theme.ts-error baseline; 0 src/ type errors. Deferred: DW-156 (the 4px head-padding difference between shell and non-shell dialogs - insetRight is identical everywhere, only insetTop differs, and the title TEXT differs by the same 4px so each glyph is correctly aligned to its own title), DW-157, DW-158 (the travel-segment buttons are named 'Reise hinzufügen'/'Reise bearbeiten', colliding with the trip-level actions - a screen reader hears one name for four actions). WORTH A REVIEWER'S ATTENTION: the guard fires on two one-select pickers where 'something to lose' is a single dropdown choice - EXPERIENCE.md's rule has no triviality threshold and AC7 names all nine, so it is applied uniformly, but this is where uniform might read as over-asking and it is one boolean per site to relax.)
# prior_note: 2026-08-03 (7-13-cost-overview-redesign implemented and reviewed via bmad-dev-auto; spec status is awaiting-operator, and the story entry here is set to awaiting-operator to match. The cost overview was the LAST screen in the app still on the pre-redesign vocabulary - 519 lines with zero tokens. references - and Story 7.9's claim that its two map screens were "the last two unredesigned screens" was simply wrong; its treatment was right, its census was not. Page shell no longer paints itself #2f343d (the third instance of the defect 7.9 thought it had fully fixed), all three Paper elevation={1} over #ffffff wrappers are Boxes on the shipped token card, month groups became nested cardAlt groups at 6px rather than a second card at 8px, and the per-day list STAYS a real Table - restyled, not converted to the div row idiom, because three columns with a header row is tabular data. DW-27 needed no new helper: src/lib/trips/formatCost.ts already existed from 7.4, so the fourth copy became an import and the "Cost: 160.00" wrapper is gone - DW-27 closed for its divergence half ONLY, its EUR-hardcoding half continues as DW-151 (no trip currency column exists; that needs a migration, not paint). Two spec premises were FALSE and both are recorded: Task 3 sent the not-found title to the caps card-label where AC8 requires the shipped treatment, so AC4 was amended rather than the code bent (a stale-URL dead end is a page title, not a 10.5px muted label) - and Task 6's "the key itself stays, it has other readers" was wrong, those four call sites were trips.stay.costSummary's LAST readers, now DW-152. Task 8 is a browser pass: jsdom lays nothing out, so the nesting judgement, the 390px column alignment and the absence of a dark inversion on the way in are all unproven. See operator_actions in the spec. Review: 0 intent_gap, 0 bad_spec, 12 patched (3 medium - the loading branch kept a skeleton sized for the retired h6 and left the screen with no heading at all, reproducing exactly what 7.9 documents itself as avoiding; both new tests were negative-only source-text guards that would pass just as happily on a surface that LOST its token, so AC2/AC3 and the component= trap had zero positive coverage; and every currency pin was en-US on a story whose point is locale symbol placement), 5 deferred, 4 rejected. Three EXISTING ledger entries were annotated, not just appended to: DW-27 closed, DW-58 (card bundle now SEVEN copies) and DW-132 (the not-found panel is no longer duplicated verbatim - this story restyled one of the two) each got seen-again. 1124 -> 1128 tests, 110 files. followup_review_recommended is TRUE.)
# earlier_note: 2026-08-03 (6-23-move-a-single-activity-to-another-day implemented and reviewed via bmad-dev-auto; spec status is awaiting-operator, story entry deliberately left at ready-for-dev until the browser pass. One activity can now be moved to another day from a footer action in the activity dialog - the target day is APPENDED to, never replaced, which is the opposite of the day-level move whose deleteMany on the target day makes it a whole-day replace wearing the name move. AC3 is nearly free and was confirmed rather than assumed: day_plan_item_images.day_plan_item_id and cost_payments.day_plan_item_id are FKs onto the item row, so one update of tripDayId carries photos, payment rows and every scalar column. Its own route POST /day-plan-items/move, not a third operation on dayActivityTransferSchema whose other two are whole-day - the common.save naming trap. Task 3 premise was FALSE: DayPlanItem has no sortOrder column at all (that is on DayPlanItemImage/CostPayment); ordering is a fromTime -> createdAt -> id comparator, so insert-by-time needs no write, and AC7 was amended in the spec rather than implemented literally - no code reverted, since the delivered behaviour was already the criterion right reading. AC6 fixed the real defect: a deleted activity left its travel segments behind and totalTravelMinutes counted them forever while segmentsByKey never drew them; one shared helper now runs on both the move and the delete path, and the client prunes them too. Task 7 is a browser pass - AC3 is the reason the story exists and no photo or payment schedule has been seen on a target day. See operator_actions in the spec. Review: 0 intent_gap, 0 bad_spec, 12 patched (4 medium - the delete-path fix never reached client state so Fahrzeit kept counting removed segments for the rest of the session and the route comment justifying that was false; a failed move showed a generic message in the dialog while the specific reason sat on the page the dialog covers; unsaved edits were discarded silently and the segment removal was disclosed only afterwards; and the move checked its precondition outside its own transaction and wrote by id alone), 3 deferred as DW-148/149/150, 8 rejected. 1119 -> 1124 tests, 110 files. followup_review_recommended is TRUE. NOTE: DW-148 is live and reachable through this feature - moving an activity between two others that already have a segment between them strands that segment, drawn by nothing and still counted; pre-existing (create and retime do the same) and an operator action asks for the number.)
# oldest_note: 2026-08-03 (6-22-activity-dialog-in-tabs implemented and reviewed via bmad-dev-auto; spec status is awaiting-operator, story entry deliberately left at ready-for-dev until the browser pass. The activity dialog's 1341px single scroll is now four tab panels - Was / Wann & Wo / Kosten / Medien & Links - with the blocks moved rather than rewritten. Panels unmount, which is safe because every field is dialog-level useState and the TipTap instance is dialog-level too, so the usual tabbed-form data-loss trap does not apply and no preservation machinery was added. The part that makes tabs safe is the error path: PLAN_ERROR_TAB is a Record over keyof PlanFieldErrors | paymentError | paymentRowErrors, so a key without a tab does not compile (verified with a throwaway seventh key), and every rejection branch selects the first tab in tab order owning an error and focuses the field. Task 6 is a browser pass - AC6 (tab bar vs the formatting toolbar directly below it) and AC9 (the tallest panel against 1341px) are both rendered-pixel claims and AC9 is the one the story exists for. See operator_actions in the spec. Review: 0 intent_gap, 0 bad_spec, 8 patched (4 medium - a validation_error naming only fields this dialog does not surface cleared every store and showed nothing at all, the exact silent save AC2 forbids; only the two time fields cleared their error on change, so a corrected title/cost/link/rich-text left its tab marked until the next save, which is a lie once the marker is global chrome; paymentRowErrors is positional and survived row removal and mode switches; and the marker was painted warnBorder #E3C7A2 at 1.62:1 on the white selected pill, now warning.main #8A5A2B at 5.87:1), 2 deferred as DW-146 and DW-147, 5 rejected. Suite 13 -> 28 tests in that file, 1095 total. followup_review_recommended is TRUE. NOTE: AC7's arrow-key navigation comes from MUI and this suite mocks MUI away, so nothing in the repo executes it - that is DW-146 and an operator action.)
