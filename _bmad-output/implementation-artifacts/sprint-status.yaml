# prior_note: 2026-08-05 (6-27-a-comma-is-a-decimal-point CREATED via bmad-create-story, ready-for-dev. BUG REPORTED FROM A REAL GERMAN PHONE: editing an accommodation, typing 12,50 into the cost field - the keyboard offers a comma, the field refuses it, and a period cannot be typed at all. IT IS SILENT DATA LOSS, NOT AN INPUT ANNOYANCE: TripAccommodationDialog:1620-1621 sets type="number" AND inputMode="decimal", which contradict each other - inputMode is what asks a German keyboard for a comma and type=number is what rejects it. On badInput the browser reports value==="", so the comma never reaches React; costRules:707-708 opens with 'if (!trimmed) return true' because an empty cost is legal, SO NO ERROR IS SHOWN; and the stay saves WITH NO COST AT ALL while the field looked filled. THE FIX ALREADY EXISTS IN THE REPO ONE FIELD DEEP: TripDayPlanDialog's ACTIVITY cost field is already type="text" + inputMode="decimal" (:1980-1981) with a parser handling comma, dot and thousands separators (:409-437) - a comma works there and was never propagated. FOUR FIELDS LEFT BEHIND: stay cost (the report), stay payment amount, activity payment amount, and travel-segment distance km. TWO FACTS THAT MAKE THIS EMBARRASSING: the app ALREADY PROMISES comma support in its own copy (de.ts:486 trips.plan.costHelper = 'Optionaler Betrag (z. B. 10,00 oder 10.00)') and keeps that promise at exactly one of five fields; and Story 6.18's docblock at TripDayTravelSegmentDialog:652-660 NAMES THIS EXACT BUG CLASS verbatim ('a comma-decimal typed on a German keyboard both look filled on screen and arrive here empty ... would then save as a silent zero') and applied the fix to the duration fields in that same file but NOT to the distance field twenty lines below. MEASURED WHILE AUTHORING, AND IT DECIDES THE TEST STRATEGY: jsdom DOES sanitise type=number exactly like a browser (fireEvent.change with '26,00' yields value===''), so a test asserting costCents===1250 FAILS TODAY and passes after the fix - the bug is genuinely testable. BUT jsdom does NOT model validity.badInput (false where browsers set true), so no implementation may read it and no test may assert it. AND THE TRAP THAT LET THE BUG SURVIVE: tripDayPlanDialog.test.tsx:520 already types '26,00' and asserts 2600 - against the ONE field that was already type=text. The comma path was tested exactly where it already worked. Nine ACs: comma accepted everywhere including 1.234,50 and 1,234.50; type=number removed (a parser CANNOT fix this - the comma is gone before any code runs); unparseable must become a VISIBLE ERROR rather than falling through to 'empty means no cost', which is the empty-vs-invalid distinction that only becomes expressible once the field is text; ONE parser moved to src/lib/trips/ beside formatCost.ts (its inverse) with both local copies DELETED; the distance field fixed with the same change but NOT through parseAmountToCents, because a distance is not money and must not be rounded to two decimals or multiplied by 100; helper text and the 0.00 placeholder made locale-correct (0,00 under de); NO server or schema change - accommodationSchemas:52 and dayPlanItemSchemas:101 take integer cents, confirmed by four suites that must pass unmodified; split-payment totals still validated with the existing assertion untouched; and attribute-level assertions (type=text, inputmode=decimal) on all five fields, because jsdom's sanitisation is the only thing between a passing suite and a broken phone. Eleven named anti-patterns, chief among them fixing the parser while leaving type=number - the most likely wrong outcome because it is the satisfying part and it makes unit tests pass. TASK 7 IS TOMMY'S: only a real German keyboard can confirm it, since neither jsdom nor a desktop browser reproduces the layout. Baseline 3be7c37: 1417 tests / 120 files green, 0 src type errors, lint 85/2. No file this story touches was changed by Story 8.3, so every line reference is current.)
# prior_note: 2026-08-05 (9-1-documents-on-stays-and-activities CONTEXTED via bmad-create-story. Status ready-for-dev, BUT THE STORY OPENS WITH A SEQUENCING BLOCK AND THE DEV AGENT IS INSTRUCTED TO STOP AND ASK TOMMY BEFORE TASK 1: Epic 9 declares 9.1 as depending on Story 8.3, which is still backlog with no story file. Every upload today lands under public/uploads/trips/<tripId>/, which Next serves statically AHEAD of any route handler and without consulting the session (uploadPaths.ts:19) - so building 9.1 now publishes every ticket PDF, with its names, addresses and booking codes, to anyone who learns the URL. That is the exposure Epic 9's own words forbid. The story was authored in full anyway and needs NO change when 8.3 lands: document URLs keep the /uploads/trips/<tripId>/... scheme with tripId as the third segment, so 8.3's catch-all handler authorises them with no URL change, no migration and no component change. 8.3 is NOT to be implemented inside 9.1, and neither is anything from 9.2 (print, pdf-lib, the packet). Eleven tasks. Findings the epic does not name and that would each have shipped wrong: (1) 'same shape as their image counterparts' IS NOT ENOUGH - the chip label is the file name and AC8 requires names to survive a backup round trip, while the on-disk name is server-generated doc-<ts>-<rand>.<ext> and carries no trace of it, so fileName MUST be a column; recorded as AC1a. (2) THE IMPORT READER REJECTS DOCUMENTS OUTRIGHT - openImportPackage refuses any member that is neither trip.json nor under photos/ (importPackage.ts:237-247), so a documents archive fails to parse until that triage learns a documents/ prefix. (3) validatePackagePhotos requires IMAGE MAGIC BYTES, so documents need a SEPARATE pool, prefix and sniffer - widening sniffPhotoContentType to accept PDF is the one change that would let a non-image be restored into a photo gallery. (4) TripExportImageRef is {sortOrder, photoId} with NO field for a name, so the document ref needs fileName