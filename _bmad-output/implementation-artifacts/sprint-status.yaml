# last_updated: 2026-08-03 (6-22-activity-dialog-in-tabs implemented and reviewed via bmad-dev-auto; spec status is awaiting-operator, story entry deliberately left at ready-for-dev until the browser pass. The activity dialog's 1341px single scroll is now four tab panels - Was / Wann & Wo / Kosten / Medien & Links - with the blocks moved rather than rewritten. Panels unmount, which is safe because every field is dialog-level useState and the TipTap instance is dialog-level too, so the usual tabbed-form data-loss trap does not apply and no preservation machinery was added. The part that makes tabs safe is the error path: PLAN_ERROR_TAB is a Record over keyof PlanFieldErrors | paymentError | paymentRowErrors, so a key without a tab does not compile (verified with a throwaway seventh key), and every rejection branch selects the first tab in tab order owning an error and focuses the field. Task 6 is a browser pass - AC6 (tab bar vs the formatting toolbar directly below it) and AC9 (the tallest panel against 1341px) are both rendered-pixel claims and AC9 is the one the story exists for. See operator_actions in the spec. Review: 0 intent_gap, 0 bad_spec, 8 patched (4 medium - a validation_error naming only fields this dialog does not surface cleared every store and showed nothing at all, the exact silent save AC2 forbids; only the two time fields cleared their error on change, so a corrected title/cost/link/rich-text left its tab marked until the next save, which is a lie once the marker is global chrome; paymentRowErrors is positional and survived row removal and mode switches; and the marker was painted warnBorder #E3C7A2 at 1.62:1 on the white selected pill, now warning.main #8A5A2B at 5.87:1), 2 deferred as DW-146 and DW-147, 5 rejected. Suite 13 -> 28 tests in that file, 1095 total. followup_review_recommended is TRUE. NOTE: AC7's arrow-key navigation comes from MUI and this suite mocks MUI away, so nothing in the repo executes it - that is DW-146 and an operator action.)
