on Tommy took: log the swallowed exception in the four admin routes (these are the only routes that can grant, revoke or delete) but NO audit table - who granted what to whom stays unrecorded by choice. Two review claims did NOT survive checking and were dismissed: admin:grant reading .env and not .env.local is CORRECT because prisma.config.ts opens with the identical dotenv/config, so the script matches the tooling that runs the migrations; and the '85-problem lint baseline' the auditor called unreproducible reproduces exactly - the variance it hit is entirely in TripAccommodationDialog, untouched here. journal_mode is 'delete' not WAL, so the register route's comment about lock upgrade stated a guarantee SQLite does not give: AC8b still holds, but via better-sqlite3 being single-process, and the losing request is now refused in the envelope instead of escaping as raw 500 HTML. NEXT: restart the :3098 instance (it predates these patches) and do the visual pass; operator must still run admin:grant on production. Prior note: 5-10-user-administration-for-admins IMPLEMENTED via bmad-dev-story, awaiting review AND one browser-only subtask. There is now a real ADMIN role - the FIRST UserRole value in this app that decides anything, since nothing has ever branched on OWNER or VIEWER (trip permission is Trip.userId and TripMember.role, two different relations wearing the same word). Added with NO MIGRATION, verified rather than assumed the way 6.16 did: prisma migrate diff run with and without the enum member produced BYTE-IDENTICAL output, and users.role is TEXT NOT NULL DEFAULT 'OWNER' with no CHECK constraint. Noted in passing - that diff is NOT EMPTY AT BASELINE, wanting to rebuild cost_payments and trip_members: pre-existing drift, unrelated, left alone. TRAP 6 WAS ANSWERED RATHER THAN ACCEPTED, and it is the story's main design decision: role lives in a 7-day session JWT, so on a surface that DELETES ACCOUNTS a revoked admin would keep full access for a week. So AUTH