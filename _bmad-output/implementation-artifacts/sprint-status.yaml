ng exactly what 7.9 documents itself as avoiding; both new tests were negative-only source-text guards that would pass just as happily on a surface that LOST its token, so AC2/AC3 and the component= trap had zero positive coverage; and every currency pin was en-US on a story whose point is locale symbol placement), 5 deferred, 4 rejected. Three EXISTING ledger entries were annotated, not just appended to: DW-27 closed, DW-58 (card bundle now SEVEN copies) and DW-132 (the not-found panel is no longer duplicated verbatim - this story restyled one of the two) each got seen-again. 1124 -> 1128 tests, 110 files. followup_review_recommended is TRUE.)
# earlier_note: 2026-08-03 (6-23-move-a-single-activity-to-another-day implemented and reviewed via bmad-dev-auto; spec status is awaiting-operator, story entry deliberately left at ready-for-dev until the browser pass. One activity can now be moved to another day from a footer action in the activity dialog - the target day is APPENDED to, never replaced, which is the opposite of the day-level move whose deleteMany on the target day makes it a whole-day replace wearing the name move. AC3 is nearly free and was confirmed rather than assumed: day_plan_item_images.day_plan_item_id and cost_payments.day_plan_item_id are FKs onto the item row, so one update of tripDayId carries photos, payment rows and every scalar column. Its own route POST /day-plan-items/move, not a third operation on dayActivityTransferSchema whose other two are whole-day - the common.save naming trap. Task 3 premise was FALSE: DayPlanItem has no sortOrder column at all (that is on DayPlanItemImage/CostPayment); ordering is a fromTime -> createdAt -> id comparator, so insert-by-time needs no write, and AC7 was amended in the spec rather than implemented literally - no code reverted, since the delivered behaviour was already the criterion right reading. AC6 fixed the real defect: a deleted activity left its travel segments behind and totalTravelMinutes counted them forever while segmentsByKey never drew them; one shared helper now runs on both the move and the delete path, and the client prunes them too. Task 7 is a browser pass - AC3 is the reason the story exists and no photo or payment schedule has been seen on a target day. See operator_actions in the spec. Review: 0 intent_gap, 0 bad_spec, 12 patched (4 medium - the delete-path fix never reached client state so Fahrzeit kept counting removed segments for the rest of the session and the route comment justifying that was false; a failed move showed a generic message in the dialog while the specific reason sat on the page the dialog covers; unsaved edits were discarded silently and the segment removal was disclosed only afterwards; and the move checked its precondition outside its own transaction and wrote by id alone), 3 deferred as DW-148/149/150, 8 rejected. 1119 -> 1124 tests, 110 files. followup_review_recommended is TRUE. NOTE: DW-148 is live and reachable through this feature - moving an activity between two others that already have a segment between them strands that segment, drawn by nothing and still counted; pre-existing (create and retime do the same) and an operator action asks for the number.)
# oldest_note: 2026-08-03 (6-22-activity-dialog-in-tabs implemented and reviewed via bmad-dev-auto; spec status is awaiting-operator, story entry deliberately left at ready-for-dev until the browser pass. The activity dialog's 1341px single scroll is now four tab panels - Was / Wann & Wo / Kosten / Medien & Links - with the blocks moved rather than rewritten. Panels unmount, which is safe because every field is dialog-level useState and the TipTap instance is dialog-level too, so the usual tabbed-form data-loss trap does not apply and no preservation machinery was added. The part that makes tabs safe is the error path: PLAN_ERROR_TAB is a Record over keyof PlanFieldErrors | paymentError | paymentRowErrors, so a key without a tab does not compile (verified with a throwaway seventh key), and every rejection branch selects the first tab in tab order owning an error and focuses the field. Task 6 is a browser pass - AC6 (tab bar vs the formatting toolbar directly below it) and AC9 (the tallest panel against 1341px) are both rendered-pixel claims and AC9 is the one the story exists for. See operator_actions in the spec. Review: 0 intent_gap, 0 bad_spec, 8 patched (4 medium - a validation_error naming only fields this dialog does not surface cleared every store and showed nothing at all, the exact silent save AC2 forbids; only the two time fields cleared their error on change, so a corrected title/cost/link/rich-text left its tab marked until the next save, which is a lie once the marker is global chrome; paymentRowErrors is positional and survived row removal and mode switches; and the marker was painted warnBorder #E3C7A2 at 1.62:1 on the white selected pill, now warning.main #8A5A2B at 5.87:1), 2 deferred as DW-146 and DW-147, 5 rejected. Suite 13 -> 28 tests in that file, 1095 total. followup_review_recommended is TRUE. NOTE: AC7's arrow-key navigation comes from MUI and this suite mocks MUI away, so nothing in the repo executes it - that is DW-146 and an operator action.)
