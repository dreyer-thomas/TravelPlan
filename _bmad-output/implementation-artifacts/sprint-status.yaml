# story_note: 2026-08-06 (5-12-shared-trips-on-the-collaborators-dashboard CREATED via bmad-create-story, ready-for-dev, re-authored from c737a3a to 51664d8. A LIVE PRODUCTION DEFECT observed 2026-08-06: an invited collaborator signs in and sees an EMPTY DASHBOARD, because listTripsForUser (tripRepo.ts:644) filters where: { userId } while getTripWithDaysForUser (:808) and every other read authorises with OR: [{ userId }, { members: { some: { userId } } }] - so the collaborator has full read access the whole time and no way in, the trip opening correctly by direct URL. The owner deleted the account and re-invited; neither step could have helped. THE GAP WAS KNOWN AND TWICE DEFERRED WITHOUT A LEDGER ENTRY - 7-4:171 recorded it ("a real product gap, it is not in this story's ACs") and 7-5:202 declined it again - which is why a real user found it instead; the story carries a task to file it as DW-199 so the next deferral is not lost the same way. Widening the where clause is the SMALLER HALF: TripSummary carries no accessRole, so a widened list alone renders somebody else's trip in a card identical to the user's own, and the shape is declared in THREE places (tripRepo.ts:51 exported, api/trips/route.ts:85-101 an explicit by-hand field map where omission is SILENT, TripsDashboard.tsx:30 a local re-declaration) - all three must gain it. FIRST FINDING, AND THE ONE THAT WOULD HAVE COST THE MOST TIME: tripRepo.ts CONTAINS A BYTE THAT MAKES file(1) CALL IT "data", so plain grep TREATS IT AS BINARY AND SILENTLY PRINTS NOTHING - not an error, no warning, just no matches. My own first sweep therefore "proved" that TripSummary, listTripsForUser and mapTripMemberRole did not exist in that file and that the draft's central references were all wrong; every one of them is in fact correct, and every line number in the story is now verified with grep -a at 51664d8. The story opens with this so the dev does not repeat it. SIX TRAPS THE DRAFT DID NOT HAVE, two of which break the suite or