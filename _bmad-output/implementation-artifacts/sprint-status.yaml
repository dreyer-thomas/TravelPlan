# prior_note: 2026-08-02 (6-19-day-hero-three-surfaces implemented and reviewed via bmad-dev-auto; spec status is awaiting-operator. Three surfaces on the day hero: "Back to trip" left the photo for the first row of the ⋯ menu, the two-slot header row was deleted rather than emptied, and the three surviving controls sit one per corner off a single shared 8px inset — the ⋯ used to inherit the hero's responsive padding, which is why it and the next-day chevron were 8px apart on a phone and 24px apart on a desktop. The title lost the header row that was its ceiling and got a real one back (the hero's top padding is now the 60px band a corner control claims) plus a responsive right padding, because zIndex stops text painting over a button but not under it. The chevrons took a dark local fill: moving them to the top corners costs them scrim, and ON_PHOTO_CHROME's white fill was making light-on-light worse, not better. HERO_SCRIM untouched. The ← glyph dropped from trips.dayView.back in both locales. Task 6 is a browser pass — AC3, AC5 and AC6 are the three ACs the story exists for and all three are rendered-pixel claims; jsdom computes no layout and does not resolve responsive sx. See operator_actions in the spec. Review: 0 intent_gap, 0 bad_spec, 8 patched (3 medium — the recorded AC6 baselines had omitted the button's own fill, so "2.41 → 3.64" compared a scrim-only before against a composited after; re-derived independently it is 1.98 → 3.64 and the ⋯ is 5.26:1 not 8.64:1, conclusion intact. Also: the AC5 280-char test used a single-day fixture and so rendered none of the chevrons it claimed to test, and the deleted 44px touch-target assertion was restored across the whole menu), 2 deferred as DW-125 and DW-126, 6 rejected — including one reviewer claim of a light/dark polarity split between the corners, which recomputation showed had conflated the ⋯'s bottom position with the chevrons' top one. followup_review_recommended is TRUE.)
